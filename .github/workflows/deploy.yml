name: Deploy Streamlit App

on:
  push:
    branches:
      - main
      - dev_new

jobs:
  deploy_main_to_azure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy files to Azure VM
        uses: appleboy/scp-action@master
        with:
          host: 20.52.228.57
          username: kosokolovsky
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          source: "."
          target: "/home/kosokolovsky/Students_Website_CI_CD"

      - name: Restart Streamlit App on Azure
        uses: appleboy/ssh-action@master
        with:
          host: 20.52.228.57
          username: kosokolovsky
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          script: |
            cd /home/kosokolovsky/Students_Website_CI_CD/tutor_streamlit/streamlit_app
            nohup streamlit run app.py --server.port 8505 > streamlit.log 2>&1 &
            disown
            echo "Streamlit started on Azure with PID $!"

  deploy_dev_to_ec2:
    if: github.ref == 'refs/heads/dev_new'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy files to EC2 instance
        uses: appleboy/scp-action@master
        with:
          host: 3.67.163.253
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "."
          target: "/home/ubuntu/Students_Website_CI_CD"

      - name: Restart Streamlit App on EC2
        uses: appleboy/ssh-action@master
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S3_BUCKET_NAME_PROJECTS: ${{ secrets.S3_BUCKET_NAME_PROJECTS }}
          AWS_ACCESS_KEY_PROJECTS: ${{ secrets.AWS_ACCESS_KEY_PROJECTS }}
          AWS_SECRET_KEY_PROJECTS: ${{ secrets.AWS_SECRET_KEY_PROJECTS }}
        with:
          host: 3.67.163.253
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GCP_SERVICE_ACCOUNT,DB_USERNAME,DB_PASSWORD,SQL_USERNAME,SQL_PASSWORD,RDS_ENDPOINT,OPENAI_API_KEY,S3_BUCKET_NAME_PROJECTS,AWS_ACCESS_KEY_PROJECTS,AWS_SECRET_KEY_PROJECTS
          script: |
            set -euo pipefail
            trap 'echo "TERM trapped → exiting 0"; exit 0' TERM INT

            cd /home/ubuntu/Students_Website_CI_CD
            python3 -m pip install --user -r requirements.txt

            if [ -z "${GCP_SERVICE_ACCOUNT:-}" ]; then
              echo "ERROR: GCP_SERVICE_ACCOUNT is empty"; exit 1
            fi

            mkdir -p streamlit_app
            printf '%s' "$GCP_SERVICE_ACCOUNT" > streamlit_app/gcp_service_account.json
            chmod 600 streamlit_app/gcp_service_account.json

            python3 - <<'PY'
            import json
            with open("streamlit_app/gcp_service_account.json","r",encoding="utf-8") as f:
                json.load(f)
            print("Service-account JSON OK")
            PY

            export DB_USERNAME="${DB_USERNAME:-}"
            export DB_PASSWORD="${DB_PASSWORD:-}"
            export SQL_USERNAME="${SQL_USERNAME:-}"
            export SQL_PASSWORD="${SQL_PASSWORD:-}"
            export RDS_ENDPOINT="${RDS_ENDPOINT:-}"
            export OPENAI_API_KEY="${OPENAI_API_KEY:-}"
            export S3_BUCKET_NAME_PROJECTS="${S3_BUCKET_NAME_PROJECTS:-}"
            export AWS_ACCESS_KEY_PROJECTS="${AWS_ACCESS_KEY_PROJECTS:-}"
            export AWS_SECRET_KEY_PROJECTS="${AWS_SECRET_KEY_PROJECTS:-}"

            cd streamlit_app

            nohup ~/.local/bin/streamlit run app.py --server.port 8506 > streamlit_dev.log 2>&1 &
            disown

            echo "Streamlit DEV started on EC2 (port 8506), PID $(cat streamlit.pid)"
            